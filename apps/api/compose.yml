services:
  pg:
    container_name: financeApp-postgres
    image: postgres:17
    restart: unless-stopped
    ports:
      # Prefixo 127.0.0.1: sem ele o Docker publica a porta em todas as
      # interfaces e o banco de desenvolvimento fica alcançável pela rede local.
      - '127.0.0.1:${DOCKER_PG_PORT}:5432'
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DOCKER_PG_USER}
      - POSTGRES_PASSWORD=${DOCKER_PG_PASSWORD}
      - POSTGRES_DB=${DOCKER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
